<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" id="brand">Meine griechischen Wörter</a>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input id="search" type="search" placeholder="Wort suchen: Griechisch oder Deutsch" autocomplete="off" aria-label="Wort suchen">

  </nav>

<main id="app"></main>
<script>
  // Load the scripts fresh each visit, so a weekly update shows at once (GitHub Pages caches for 10 minutes).
  (function () {
    var v = Date.now(), files = ["config.js", "words.js", "app.js"];
    (function next() {
      var f = files.shift();
      if (!f) return;
      var s = document.createElement("script");
      s.src = f + "?v=" + v;
      s.onload = next;
      document.body.appendChild(s);
    })();
  })();
</script>
</body>
